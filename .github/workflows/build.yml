name: Build & Export (Web & Android)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-web:
    name: Export Web (HTML5)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Web Directory
        run: mkdir -v -p build/web

      - name: Setup Export Templates
        run: |
          mkdir -p "$HOME/.local/share/godot"
          if [ -d "/root/.local/share/godot/export_templates" ]; then
            cp -r /root/.local/share/godot/export_templates "$HOME/.local/share/godot/"
          elif [ -d "/root/.local/share/godot/templates" ]; then
            cp -r /root/.local/share/godot/templates "$HOME/.local/share/godot/export_templates"
          fi
          echo "Templates in $HOME:"
          ls -la "$HOME/.local/share/godot/export_templates/" || true

      - name: Import Project Assets
        run: godot -v --headless --editor --quit || true

      - name: Export WebAssembly / HTML5
        run: |
          godot -v --headless --export-release "Web" build/web/index.html 2>&1 | tee export_web.log
          if [ ! -f build/web/index.html ]; then
            ERR_MSG=$(tail -n 25 export_web.log | tr '\n' ' ')
            echo "::error::Web export failed: $ERR_MSG"
            exit 1
          fi

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vivarium-Abnormalia-Web
          path: build/web/
          retention-days: 14

  export-android:
    name: Export Android (APK)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Android Directory
        run: mkdir -v -p build/android

      - name: Setup Export Templates
        run: |
          mkdir -p "$HOME/.local/share/godot"
          if [ -d "/root/.local/share/godot/export_templates" ]; then
            cp -r /root/.local/share/godot/export_templates "$HOME/.local/share/godot/"
          elif [ -d "/root/.local/share/godot/templates" ]; then
            cp -r /root/.local/share/godot/templates "$HOME/.local/share/godot/export_templates"
          fi

      - name: Setup Android SDK, Java and Keystore
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          cp ~/.android/debug.keystore ./debug.keystore
          
          # Detect Java SDK
          JAVA_BIN=$(which javac || which java)
          JAVA_PATH=$(dirname $(dirname $(readlink -f "$JAVA_BIN")))
          echo "Using Java at: $JAVA_PATH"
          
          # Detect Android SDK path
          SDK_PATH="${ANDROID_HOME:-/usr/lib/android-sdk}"
          echo "Using Android SDK at: $SDK_PATH"
          
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$JAVA_PATH" "$SDK_PATH" "$HOME/.android/debug.keystore" > ~/.config/godot/editor_settings-4.tres
          cat ~/.config/godot/editor_settings-4.tres

      - name: Import Project Assets
        run: godot -v --headless --editor --quit || true

      - name: Export Android APK
        run: |
          godot -v --headless --export-debug "Android" build/android/VivariumAbnormalia.apk 2>&1 | tee export_android.log
          if [ ! -f build/android/VivariumAbnormalia.apk ]; then
            ERR_MSG=$(tail -n 25 export_android.log | tr '\n' ' ')
            echo "::error::Android export failed: $ERR_MSG"
            exit 1
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vivarium-Abnormalia-APK
          path: build/android/VivariumAbnormalia.apk
          retention-days: 14
