name: Build & Export (Web & Android)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-web:
    name: Export Web (HTML5)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Web Directory
        run: mkdir -v -p build/web

      - name: Import Assets (Headless Editor Run)
        run: |
          godot -v --headless --editor --quit || true

      - name: Export WebAssembly / HTML5
        run: |
          godot -v --headless --export-release "Web" build/web/index.html

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vivarium-Abnormalia-Web
          path: build/web/
          retention-days: 14

  export-android:
    name: Export Android (APK)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Android Directory
        run: mkdir -v -p build/android

      - name: Import Assets (Headless Editor Run)
        run: |
          godot -v --headless --editor --quit || true

      - name: Setup Android SDK and Keystore
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          cp ~/.android/debug.keystore ./debug.keystore
          
          # Configure Godot Editor Settings for Android SDK
          GODOT_SETTINGS_DIR=~/.config/godot
          mkdir -p "$GODOT_SETTINGS_DIR"
          
          # Detect Android SDK path
          SDK_PATH="${ANDROID_HOME:-/usr/lib/android-sdk}"
          echo "Using Android SDK at: $SDK_PATH"
          
          cat <<EOF > "$GODOT_SETTINGS_DIR/editor_settings-4.tres"
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "$SDK_PATH"
export/android/debug_keystore = "$HOME/.android/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
export/android/force_system_user = false
EOF

      - name: Export Android APK
        run: |
          godot -v --headless --export-debug "Android" build/android/VivariumAbnormalia.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vivarium-Abnormalia-APK
          path: build/android/VivariumAbnormalia.apk
          retention-days: 14
